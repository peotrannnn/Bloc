<script>
const D=JSON.parse(document.getElementById('data').textContent),N=D.N,T=D.T,S=18,Z=2.6;   /* S: cỡ ô khi vẽ; Z: phóng to cho bàn 9×9 nhỏ */
document.getElementById('sub').textContent='· '+D.maps.length+' map · biome: '+D.biomeOpt;
const NAME={forest:'rừng',mountain:'núi',snow:'tuyết',balanced:'cân bằng',river:'sông',desert:'sa mạc'};
const grid=document.getElementById('grid');
function draw(m){
  const cv=document.createElement('canvas'),dpr=window.devicePixelRatio||1;
  cv.width=N*S*Z*dpr;cv.height=N*S*Z*dpr;
  const g=cv.getContext('2d');g.scale(dpr*Z,dpr*Z);
  const xy=k=>[(k%N)*S,((k/N)|0)*S];
  for(let k=0;k<N*N;k++){
    const [x,y]=xy(k),r=(k/N)|0,c=k%N,v=m.terr[k];
    g.fillStyle=(r+c)%2?'#e9e5d9':'#dfdac9';g.fillRect(x,y,S,S);
    if(r<D.SAFE||r>N-D.SAFE-1){g.fillStyle='rgba(120,140,200,.12)';g.fillRect(x,y,S,S);}
    if(v===T.STONE){g.fillStyle='#6b7280';g.fillRect(x,y,S,S);g.fillStyle='#4b5260';g.fillRect(x,y+S-3,S,3);g.fillStyle='#8a92a1';g.fillRect(x+2,y+2,S-8,3);}
    else if(v===T.BRUSH){g.fillStyle='#4ea45f';g.fillRect(x,y,S,S);g.strokeStyle='#2f7a40';g.lineWidth=1.3;g.beginPath();
      for(const[a,b]of[[4,14],[9,15],[14,14]]){g.moveTo(x+a,y+b);g.lineTo(x+a-1.5,y+b-8);g.moveTo(x+a,y+b);g.lineTo(x+a+2,y+b-7);}g.stroke();}
    else if(v===T.ICE){g.fillStyle='#bfe6f5';g.fillRect(x,y,S,S);g.fillStyle='rgba(255,255,255,.75)';g.fillRect(x+2,y+2,S-9,2);g.fillRect(x+2,y+2,2,S-9);
      g.strokeStyle='#8cc8e0';g.lineWidth=1;g.strokeRect(x+.5,y+.5,S-1,S-1);}
    else if(v===T.WATER){g.fillStyle='#4aa3df';g.fillRect(x,y,S,S);g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=1.2;g.beginPath();
      for(const[a,b]of[[2,6],[9,6],[5,12],[12,12]]){g.moveTo(x+a,y+b);g.quadraticCurveTo(x+a+2,y+b-3,x+a+4,y+b);g.quadraticCurveTo(x+a+6,y+b+3,x+a+8,y+b);}g.stroke();}
    else if(v===T.SAND){g.fillStyle='#e3c88a';g.fillRect(x,y,S,S);g.fillStyle='#c9a95e';
      for(const[a,b]of[[4,4],[11,6],[7,10],[14,13],[3,14]]){g.fillRect(x+a,y+b,1.6,1.6);}}
  }
  g.strokeStyle='rgba(0,0,0,.06)';g.lineWidth=1;
  for(let i=0;i<=N;i++){g.beginPath();g.moveTo(i*S,0);g.lineTo(i*S,N*S);g.moveTo(0,i*S);g.lineTo(N*S,i*S);g.stroke();}
  /* cạnh giữa hai ô nước/cát kề nhau: không đặt tường được */
  const soft=k=>m.terr[k]===T.WATER||m.terr[k]===T.SAND;
  g.setLineDash([2,2]);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=1.4;
  for(let k=0;k<N*N;k++){
    if(!soft(k))continue;const[x,y]=xy(k),r=(k/N)|0,c=k%N;
    if(c<N-1&&soft(k+1)){g.beginPath();g.moveTo(x+S,y+2);g.lineTo(x+S,y+S-2);g.stroke();}
    if(r<N-1&&soft(k+N)){g.beginPath();g.moveTo(x+2,y+S);g.lineTo(x+S-2,y+S);g.stroke();}
  }
  g.setLineDash([]);
  /* đường nối cặp cổng */
  g.setLineDash([4,4]);g.strokeStyle='rgba(155,107,220,.7)';g.lineWidth=1.5;
  for(const[a,b]of m.portals){const[ax,ay]=xy(a),[bx,by]=xy(b);g.beginPath();g.moveTo(ax+S/2,ay+S/2);g.lineTo(bx+S/2,by+S/2);g.stroke();}
  g.setLineDash([]);
  for(let k=0;k<N*N;k++){
    const [x,y]=xy(k),v=m.terr[k],cx=x+S/2,cy=y+S/2;
    if(v===T.TRAP){g.fillStyle='#d9534f';g.beginPath();g.moveTo(cx,y+2);g.lineTo(x+S-2,y+S-3);g.lineTo(x+2,y+S-3);g.closePath();g.fill();
      g.fillStyle='#fff';g.font='bold 10px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('!',cx,cy+2);}
    else if(v===T.CHEST){g.fillStyle='#f0b429';g.fillRect(x+2,y+5,S-4,S-8);g.fillStyle='#b9801a';g.fillRect(x+2,y+9,S-4,2);g.fillRect(cx-1.5,y+8,3,4);}
  }
  m.portals.forEach(([a,b],i)=>{for(const k of[a,b]){const[x,y]=xy(k);
    g.fillStyle='#9b6bdc';g.beginPath();g.arc(x+S/2,y+S/2,S/2-1.5,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=1.2;g.stroke();
    g.fillStyle='#fff';g.font='bold 11px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(String.fromCharCode(65+i),x+S/2,y+S/2+.5);}});
  const pawn=(col,row,fill,stroke,ch)=>{const x=col*S+S/2,y=row*S+S/2;
    g.fillStyle=fill;g.strokeStyle=stroke;g.lineWidth=2;g.beginPath();g.arc(x,y,S/2-1,0,7);g.fill();g.stroke();
    g.fillStyle=stroke;g.font='bold 11px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,x,y+.5);};
  pawn(m.spawn[0],N-1,'#fff','#222','T');
  pawn(m.spawn[1],0,'#222','#fff','Đ');
  return cv;
}
for(const m of D.maps){
  const card=document.createElement('div');card.className='card';
  const kinds={stone:'đá',brush:'cỏ',ice:'băng',water:'sông',sand:'cát góc'};
  const cl=['stone','brush','ice','water','sand'].filter(k=>k!=='water'&&k!=='sand'||m.clusters.some(c=>c.kind===k)).map(k=>{const l=m.clusters.filter(c=>c.kind===k);return kinds[k]+': '+(l.length?l.map(c=>c.n+' ('+c.shape+')').join(', '):'-');}).join(' · ');
  const cnt=v=>m.terr.filter(x=>x===v).length;
  card.innerHTML='<h2>seed '+m.seed+'<span class="tag '+m.biome+'">'+(NAME[m.biome]||m.biome)+'</span></h2>'+
    '<p>đường đi ngắn nhất: Trắng '+m.paths[0]+' · Đen '+m.paths[1]+' · chi phí (nước ×2): Trắng '+m.costs[0]+' · Đen '+m.costs[1]+' · thử lần '+(m.attempt+1)+(m.fallback?' · <b style="color:#f66">BÀN TRỐNG DỰ PHÒNG</b>':'')+'</p>';
  card.appendChild(draw(m));
  const p=document.createElement('p');p.textContent=cl+' · bẫy '+cnt(T.TRAP)+' · rương '+cnt(T.CHEST)+' · cặp cổng '+m.portals.length+' · ô nước '+cnt(T.WATER)+' · ô cát '+cnt(T.SAND);card.appendChild(p);
  grid.appendChild(card);
}
</script></body></html>
