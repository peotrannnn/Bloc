<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloc</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/online.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/guide.css">
</head>
<body>
<header><div id="status"></div><div id="info"></div></header>
<main id="board">
  <!-- Thanh khả năng thắng: Trắng ở dưới, Đen ở trên; vạch giữa là điểm chia, dịch theo từng nước đi -->
  <div id="evalbar" role="img" aria-label="Khả năng thắng">
    <div id="evW"></div><i id="evMid"></i>
    <span id="evBt"></span><span id="evWt"></span>
  </div>
  <div id="host"></div>
</main>
<footer>
<button id="bMove" aria-pressed="true" data-tn="Đi quân" data-tk="Q" data-tip="Chọn một ô sáng để bước tới. Có thể nhảy qua đối thủ đứng kề.">Đi (Q)</button>
<button id="bWall" aria-pressed="false" data-tn="Đặt tường" data-tk="W" data-tip="Dựng tường chặn đường đối thủ (phủ 2 cạnh ô). Không được bịt kín hẳn đường về đích.">Tường (W)</button>
<button id="bRot" data-tn="Xoay tường" data-tk="R" data-tip="Đổi tường đang đặt giữa ngang và dọc.">Xoay (R)</button>
<button id="bPause" hidden data-tn="Tạm dừng" data-tk="Space" data-tip="Dừng hoặc tiếp tục ván máy đấu máy.">Dừng</button>
<button id="bView" data-tn="Góc nhìn" data-tk="E" data-tip="Đổi góc camera: tự do hoặc bám theo từng quân.">Góc (E)</button>
<button id="bEval" aria-pressed="true" data-tn="Đánh giá" data-tk="T" data-tip="Bật/tắt thanh khả năng thắng bên trái bàn cờ.">Đánh giá (T)</button>
<button id="bGuide" aria-pressed="false" data-tn="Hướng dẫn" data-tk="I" data-tip="Cách chơi, các loại ô, vật phẩm và sự kiện. Bấm lần nữa để đóng.">Hướng dẫn (I)</button>
<button id="bSet" data-tn="Cài đặt" data-tk="O" data-tip="Chỉnh âm lượng và âm thanh.">Cài đặt (O)</button>
<span class="rmgrp"><button id="bReset" data-tn="Ván mới" data-tk="P" data-tip="Bắt đầu một ván mới.">Mới (P)</button><span id="rmOpp" class="rmopp" role="status" aria-live="polite" hidden><i></i>Đối thủ sẵn sàng</span></span>
<button id="bMenu" data-tn="Về menu" data-tk="Esc" data-tip="Rời ván đang chơi và quay lại menu chính.">Menu (Esc)</button>
</footer>

<!-- Cửa sổ xác nhận (đầu hàng / thoát game): mở bằng UI.ask(). Màu theo biome đang chơi, mặc định xanh lá. -->
<div id="cf" hidden>
 <div class="win pop" role="alertdialog" aria-modal="true" aria-labelledby="cfT" aria-describedby="cfM">
  <div class="tb"><span id="cfT">Xác nhận</span><button id="cfX" class="wx" aria-label="Đóng" data-tip="Đóng" data-tk="Esc">X</button></div>
  <div class="wb"><div id="cfM"></div>
   <div class="cfb"><button id="cfNo">Hủy</button><button id="cfYes" class="p">Đồng ý</button></div></div>
 </div>
</div>

<!-- Cửa sổ Hướng dẫn (js/guide.js): màu theo biome đang chơi, mặc định xanh lá. Phím I / nút X / Esc để đóng. -->
<div id="gd" hidden>
 <div class="win pop" role="dialog" aria-modal="true" aria-labelledby="gdT">
  <div class="tb"><span id="gdT">Hướng dẫn</span><button id="gdX" class="wx" aria-label="Đóng" data-tip="Đóng" data-tk="I">X</button></div>
  <div class="gdw"><nav id="gdNav" aria-label="Mục hướng dẫn"></nav><div id="gdMain" tabindex="-1"></div></div>
 </div>
</div>

<div id="menu">
 <div class="win">
  <div class="tb"><span id="winTitle">Bloc - menu</span><span id="onCount" class="onc" hidden data-tn="Đang online" data-tip="Số người đang mở game trên toàn server."><i></i><span></span></span><button id="winX" class="wx" aria-label="Đóng cửa sổ" data-tip="Đóng" data-tk="Esc" hidden>X</button></div>
  <div class="wb">

  <!-- Màn hình khởi động (js/menu.js, Menu.boot): tải sẵn three.js + dựng cảnh + chuẩn bị âm thanh trong lúc người chơi nhập tên.
       Cử chỉ (gõ phím / bấm chuột) ở đây cũng là lần tương tác đầu tiên nên trình duyệt cho phép phát tiếng từ menu trở đi. -->
  <section class="scr" id="scBoot">
    <div class="sub">Tên của bạn</div>
    <input id="bName" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Nhập tên hiển thị" aria-label="Tên hiển thị">
    <div class="pbar" id="bootBar" aria-hidden="true"><b></b></div>
    <div id="bootMsg" class="bootmsg" role="status" aria-live="polite">Đang chuẩn bị…</div>
    <button class="big p" id="bootGo" disabled>Vào game</button>
  </section>

  <!-- Màn hình chính: 3 chế độ. Các màn hình con không có nút "Về": đóng cửa sổ bằng nút X trên thanh tiêu đề (hoặc Esc) -->
  <section class="scr" id="scHome" hidden>
    <div class="hello" id="homeName"></div>
    <button class="big" id="mOnline" data-tn="Chơi online" data-tip="Đấu với mấy khứa trên mạng.">Chơi online</button>
    <button class="big p" id="mPve" data-tn="Chơi với máy" data-tip="Đấu với máy.">Chơi với máy</button>
    <button class="big" id="mEve" data-tn="Cá độ" data-tip="AI vs AI: chọn mô hình cho Trắng & Đen rồi ngồi coi.">Cá cược</button>
    <button class="big" id="mSet" data-tn="Cài đặt" data-tip="Chỉnh âm lượng và âm thanh.">Cài đặt</button>
    <button class="lnk" id="mRename" data-tn="Đổi tên" data-tip="Đổi tên hiển thị của bạn.">đổi tên</button>
  </section>

  <!-- Đấu với máy: chọn đối thủ -->
  <section class="scr" id="scPve" hidden>
    <div class="sub">Chọn đối thủ</div>
    <div class="opts" id="pveList" role="radiogroup"></div>
    <button class="big p" id="pvePlay">Chơi</button>
  </section>

  <!-- Máy đấu máy: chọn mô hình cho từng bên -->
  <section class="scr" id="scEve" hidden>
    <label class="row">Trắng <select id="eveA"></select></label>
    <label class="row">Đen <select id="eveB"></select></label>
    <label class="row">Tốc độ
      <select id="spd">
        <option value="1400">Chậm</option>
        <option value="900" selected>Vừa</option>
        <option value="400">Nhanh</option>
      </select>
    </label>
    <button class="big p" id="evePlay">Chơi</button>
  </section>

  <!-- Đấu online: tạo phòng hoặc nhập mã -->
  <section class="scr" id="scOnline" hidden>
    <div class="sub" id="onSub">Online · Classic</div>
    <label class="row" data-tn="Chế độ chơi" data-tip="Classic: luật Quoridor gốc.
Hỗn Loạn: có địa hình, rương và vật phẩm (bựa lắm chơi đi).">Chế độ
      <select id="onMode">
        <option value="classic">Classic</option>
        <option value="chaos">Hỗn Loạn</option>
      </select>
    </label>
    <label class="row" id="onBiomeRow" hidden>Bản đồ
      <select id="onBiome"></select>
    </label>
    <label class="row">Phòng
      <select id="onVis">
        <option value="private">Riêng tư</option>
        <option value="public">Công khai</option>
      </select>
    </label>
    <button class="big" id="onResume" hidden data-tn="Vô lại" data-tip="Quay lại ván đang dang dở của bạn.">Vào lại</button>
    <button class="big p" id="onCreate" data-tn="Tạo phòng" data-tip="Tạo phòng mới và nhận mã để gửi cho bạn bè.">Tạo phòng</button>
    <button class="big" id="onQuick" data-tn="Ghép nhanh" data-tip="Xem các phòng công khai đang chờ rồi chọn phòng muốn vào.">Ghép nhanh</button>
    <div class="sub">hoặc nhập mã</div>
    <input id="onCode" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Mã phòng" aria-label="Mã phòng">
    <button class="big" id="onJoin" data-tn="Vào phòng" data-tip="Vô phòng bằng mã.">Vào</button>
    <div id="onErr" class="err" role="alert" hidden></div>
  </section>

  <!-- Ghép nhanh: danh sách phòng công khai đang chờ (tự làm mới), bấm một phòng để vào -->
  <section class="scr" id="scQuick" hidden>
    <div class="sub">Phòng đang chờ</div>
    <label class="row">Chế độ
      <select id="qMode"><option value="all">Tất cả</option><option value="classic">Classic</option><option value="chaos">Hỗn Loạn</option></select>
    </label>
    <label class="row" id="qBiomeRow">Bản đồ
      <select id="qBiome"></select>
    </label>
    <div class="opts rooms" id="qList" role="list" aria-live="polite"></div>
    <div id="qEmpty" class="sub" hidden>chưa có phòng nào khớp</div>
    <button class="big" id="qAuto" data-tn="Vô bừa" data-tip="Không chọn: server ghép vào phòng chờ lâu nhất (hoặc tạo phòng mới) theo chế độ và bản đồ ở màn trước.">Vô bừa</button>
    <div id="qErr" class="err" role="alert" hidden></div>
  </section>

  <!-- Phòng chờ: hiện mã để gửi cho bạn bè -->
  <section class="scr" id="scWait" hidden>
    <div class="sub">Mã phòng</div>
    <div id="waitCode" class="code"></div>
    <div id="waitMode" class="sub"></div>
    <button id="waitCopy" data-tip="Chép mã phòng cho bạn bè.">Chép mã</button>
    <div id="waitMsg" class="sub"></div>
  </section>

  <div id="ld" hidden><div id="bar"><b></b></div><div id="msg"></div></div>
  </div>
 </div>
</div>

<!-- Màn hình tải dùng chung (xem js/loading.js): vào phòng, đấu lại -->
<div id="loading" hidden role="status" aria-live="polite">
 <div class="ldbox">
  <div class="ldspin" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="ldtitle">Đang tải</div>
  <div class="ldbar"><b></b></div>
  <div class="ldmsg"></div>
 </div>
</div>

<!-- Thứ tự nạp quan trọng: module sau dùng biến của module trước -->
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/sfx.js"></script>
<script src="js/settings.js"></script>
<script src="js/loading.js"></script>
<script src="js/loader.js"></script>
<script src="js/online-client.js"></script>
<script src="js/state.js"></script>
<script src="js/core.js"></script>
<script src="js/rules.js"></script>
<script src="js/eval.js"></script>
<script src="js/review.js"></script>
<script src="js/ai/registry.js"></script>

<script src="js/ai/basic.js"></script>
<script src="js/ai/dumb.js"></script>
<script src="js/ai/tools.js"></script>
<script src="js/ai/attacker.js"></script>
<script src="js/ai/defender.js"></script>
<script src="js/ai/thug.js"></script>
<script src="js/ai/mirror.js"></script>
<script src="js/ai/keeper.js"></script>
<script src="js/ai/control.js"></script>
<script src="js/ai/gambler.js"></script>
<script src="js/ai/biet.js"></script>
<script src="js/ai/worker-src.js"></script>
<script src="js/ai/client.js"></script>

<script src="js/guide-data.js"></script>
<script src="js/view/stage.js"></script>
<script src="js/view/terrain.js"></script>
<script src="js/view/weather.js"></script>
<script src="js/view/pawns.js"></script>
<script src="js/blocker-plan.js"></script>
<script src="js/view/blocker.js"></script>
<script src="js/view/walls.js"></script>
<script src="js/view/badges.js"></script>
<script src="js/view/marks.js"></script>
<script src="js/view/fireworks.js"></script>
<script src="js/view/camera.js"></script>
<script src="js/tooltip.js"></script>
<script src="js/ui.js"></script>
<script src="js/guide.js"></script>
<script src="js/audio.js"></script>
<script src="js/menu.js"></script>
<script src="js/input.js"></script>
<script src="js/app.js"></script>
</body>
</html>
